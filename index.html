<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIA — Cancha Interactiva Asincrónica «CR7»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-body">

  <main class="login-wrap">
    <section class="login-card">
      <span class="topbar-eyebrow">CIA · Cancha Interactiva Asincrónica</span>
      <h1 class="login-title">Entra a la cancha «CR7»</h1>
      <p class="login-sub">Elige tu personaje, confirma tu tarjeta y entra a la cancha compartida.</p>

      <section class="character-step" id="character-step">
        <span class="login-label">1. Elige tu personaje</span>
        <div class="character-grid" id="character-grid" role="radiogroup" aria-label="Selección de personaje"></div>
        <button type="button" class="login-submit character-confirm" id="character-confirm" disabled>Confirmar personaje</button>
      </section>

      <form id="login-form" class="login-form" hidden>
        <span class="login-label">2. Datos de jugador</span>
        <label class="login-label" for="nombre-input">Nombre de usuario</label>
        <input id="nombre-input" class="login-input" type="text" maxlength="20" placeholder="Ej: CARLOS" autocomplete="off" required>

        <span class="login-label">Color</span>
        <div id="color-grid" class="color-grid" role="radiogroup" aria-label="Selección de color"></div>

        <p id="login-error" class="login-error" hidden></p>

        <button type="submit" class="login-submit" id="login-submit">Entrar a la cancha</button>
      </form>
    </section>

    <aside class="login-card login-lobby">
      <div class="minimap-heading">
        <span>Sala de espera</span>
        <span id="lobby-count">0 conectados</span>
      </div>
      <ul id="lobby-list" class="lobby-list"></ul>
    </aside>
  </main>

  <script src="/socket.io/socket.io.js"></script>
  <script src="assets/js/game-client.js"></script>
  <script>
    const colorGrid = document.getElementById("color-grid");
    const characterGrid = document.getElementById("character-grid");
    const characterStep = document.getElementById("character-step");
    const characterConfirm = document.getElementById("character-confirm");
    const form = document.getElementById("login-form");
    const nombreInput = document.getElementById("nombre-input");
    const errorEl = document.getElementById("login-error");
    const submitBtn = document.getElementById("login-submit");
    const lobbyList = document.getElementById("lobby-list");
    const lobbyCount = document.getElementById("lobby-count");

    let paleta = [];
    let colorElegido = null;
    let personajeElegido = null;

    const personajes = ["BLUE", "GREEN", "ORANGE", "PINK", "SILVER"];
    const nombresPersonajes = {
      BLUE: "Blue",
      GREEN: "Green",
      ORANGE: "Orange",
      PINK: "Pink",
      SILVER: "Silver",
    };

    personajes.forEach((personaje) => {
      const card = document.createElement("button");
      card.type = "button";
      card.className = "character-card";
      card.setAttribute("role", "radio");
      card.setAttribute("aria-label", nombresPersonajes[personaje]);
      card.innerHTML = `<img src="assets/img/pj/SELECCION%20DE%20PJ/${personaje}.JPG" alt=""><span>${nombresPersonajes[personaje]}</span>`;
      card.addEventListener("click", () => {
        personajeElegido = personaje;
        [...characterGrid.children].forEach((el) => el.classList.remove("is-selected"));
        card.classList.add("is-selected");
        characterConfirm.disabled = false;
      });
      characterGrid.appendChild(card);
    });

    characterConfirm.addEventListener("click", () => {
      characterStep.hidden = true;
      form.hidden = false;
      nombreInput.focus();
    });

    function coloresTomados(jugadores) {
      return new Set(jugadores.filter((j) => j.conectado).map((j) => j.color));
    }

    function pintarPaleta(jugadores) {
      const tomados = coloresTomados(jugadores);
      colorGrid.innerHTML = "";
      paleta.forEach((c) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "color-swatch";
        btn.style.background = c.hex;
        btn.title = c.nombre;
        btn.setAttribute("role", "radio");
        btn.setAttribute("aria-label", c.nombre);
        const ocupado = tomados.has(c.id);
        btn.disabled = ocupado;
        btn.classList.toggle("is-taken", ocupado);
        btn.classList.toggle("is-selected", colorElegido === c.id);
        btn.addEventListener("click", () => {
          colorElegido = c.id;
          [...colorGrid.children].forEach((el) => el.classList.remove("is-selected"));
          btn.classList.add("is-selected");
        });
        colorGrid.appendChild(btn);
      });
    }

    function pintarLobby(jugadores) {
      const conectados = jugadores.filter((j) => j.conectado);
      lobbyCount.textContent = `${conectados.length} conectado${conectados.length === 1 ? "" : "s"}`;
      lobbyList.innerHTML = "";
      if (!conectados.length) {
        const li = document.createElement("li");
        li.className = "lobby-empty";
        li.textContent = "Todavía no hay nadie en la cancha. ¡Sé el primero!";
        lobbyList.appendChild(li);
        return;
      }
      conectados.forEach((j) => {
        const info = paleta.find((c) => c.id === j.color);
        const li = document.createElement("li");
        li.innerHTML = `<span class="color-dot" style="background:${info ? info.hex : "#999"}"></span> ${j.nombre}`;
        lobbyList.appendChild(li);
      });
    }

    function aplicarEstado(estado) {
      paleta = estado.config.paleta;
      pintarPaleta(estado.jugadores);
      pintarLobby(estado.jugadores);
    }

    CIA.observar().then(aplicarEstado);
    CIA.socket.on("jugador_nuevo", () => CIA.observar().then(aplicarEstado));
    CIA.socket.on("jugador_reconectado", () => CIA.observar().then(aplicarEstado));
    CIA.socket.on("jugador_desconectado", () => CIA.observar().then(aplicarEstado));

    const sesionPrevia = CIA.obtenerSesion();
    if (sesionPrevia) {
      CIA.reclamarSesion().then((res) => {
        if (res.ok) window.location.href = "pages/cancha.html";
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.hidden = true;
      const nombre = nombreInput.value.trim();
      if (!nombre) {
        errorEl.textContent = "Ingresa un nombre de usuario.";
        errorEl.hidden = false;
        return;
      }
      if (!colorElegido) {
        errorEl.textContent = "Elige un color disponible.";
        errorEl.hidden = false;
        return;
      }
      submitBtn.disabled = true;
      const respuesta = await CIA.unirse(nombre, colorElegido, personajeElegido);
      submitBtn.disabled = false;
      if (!respuesta.ok) {
        errorEl.textContent = respuesta.motivo || "No se pudo entrar a la cancha.";
        errorEl.hidden = false;
        return;
      }
      window.location.href = "pages/cancha.html";
    });
  </script>
</body>
</html>
