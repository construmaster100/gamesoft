<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CIA — Cancha Interactiva Asincrónica «CR7»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="login-body">

  <header class="navbar navbar-dark bg-dark px-3 px-md-4">
    <span class="navbar-brand mb-0">
      <span class="topbar-eyebrow">CIA · Cancha Interactiva Asincrónica</span>
      <span class="d-block h5 mb-0">Entra a la cancha «CR7»</span>
    </span>
  </header>

  <main class="login-wrap container-fluid py-4">
    <div class="row g-4 justify-content-center">
      <div class="col-12 col-lg-6">
        <div class="card login-card shadow-sm h-100">
          <div class="card-body p-4">
            <p class="login-sub card-text">Elige tu personaje, confirma tu tarjeta y entra a la cancha compartida.</p>

            <form id="login-form" class="login-form">
              <span class="login-label">1. Elige tu personaje/color</span>

              <div id="personaje-carousel" class="personaje-carousel mb-2">
                <div class="carousel-indicators" id="personaje-indicators"></div>
                <div class="carousel-inner" id="personaje-inner"></div>
                <button class="carousel-control-prev" type="button" id="personaje-prev" aria-label="Personaje anterior">‹</button>
                <button class="carousel-control-next" type="button" id="personaje-next" aria-label="Personaje siguiente">›</button>
              </div>
              <p class="personaje-elegido-text" id="personaje-elegido-text">Ningún personaje elegido todavía.</p>

              <label class="login-label" for="nombre-input">2. Nombre del jugador</label>
              <input id="nombre-input" class="login-input form-control" type="text" maxlength="20" placeholder="Ej: CARLOS" autocomplete="off" required>

              <p id="login-error" class="login-error" hidden></p>

              <button type="submit" class="login-submit btn" id="login-submit">Entrar a la cancha</button>
            </form>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="side-stack">
          <img id="portada" src="assets/img/portada.png" alt="Portada" class="side-stack-image rounded shadow-sm">
          <aside class="card login-card login-lobby side-stack-lobby">
            <div class="card-body">
              <div class="minimap-heading">
                <span>Sala de espera</span>
                <span id="lobby-count">0 conectados</span>
              </div>
              <ul id="lobby-list" class="lobby-list"></ul>
            </div>
          </aside>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/socket.io/socket.io.js"></script>
  <script src="assets/js/game-client.js"></script>
  <script>
    const personajeIndicators = document.getElementById("personaje-indicators");
    const personajeInner = document.getElementById("personaje-inner");
    const personajeElegidoText = document.getElementById("personaje-elegido-text");
    const form = document.getElementById("login-form");
    const nombreInput = document.getElementById("nombre-input");
    const errorEl = document.getElementById("login-error");
    const submitBtn = document.getElementById("login-submit");
    const lobbyList = document.getElementById("lobby-list");
    const lobbyCount = document.getElementById("lobby-count");

    let paleta = [];
    let colorElegido = null;
    let personajeElegido = null;

    const personajes = ["BLUE", "GREEN", "ORANGE", "PINK", "SILVER", "ALSILVER", "BLACKMATTER", "ERROR", "EVA", "FAST", "GOLDENBOY"];
    const nombresPersonajes = {
      BLUE: "Blue",
      GREEN: "Green",
      ORANGE: "Orange",
      PINK: "Pink",
      SILVER: "Silver",
      ALSILVER: "Alsilver",
      BLACKMATTER: "Black Matter",
      ERROR: "Error",
      EVA: "Eva",
      FAST: "Fast",
      GOLDENBOY: "Goldenboy",
    };
    const coloresPorPersonaje = {
      BLUE: "azul",
      GREEN: "verde",
      ORANGE: "naranja",
      PINK: "rosa",
      SILVER: "negro",
      ALSILVER: "blanco",
      BLACKMATTER: "morado",
      ERROR: "rojo",
      EVA: "cian",
      FAST: "amarillo",
      GOLDENBOY: "dorado",
    };

    function marcarElegido(personaje) {
      personajeElegido = personaje;
      colorElegido = coloresPorPersonaje[personaje];
      [...personajeInner.children].forEach((item) => {
        item.classList.toggle("is-selected", item.dataset.personaje === personaje);
      });
      personajeElegidoText.textContent = `Elegiste a ${nombresPersonajes[personaje]} · color ${coloresPorPersonaje[personaje]}.`;
    }

    let personajeIndex = 0;
    function mostrarPersonajeIndex(index) {
      personajeIndex = (index + personajes.length) % personajes.length;
      [...personajeInner.children].forEach((item, i) => item.classList.toggle("active", i === personajeIndex));
      [...personajeIndicators.children].forEach((dot, i) => dot.classList.toggle("active", i === personajeIndex));
    }

    personajes.forEach((personaje, index) => {
      const indicator = document.createElement("button");
      indicator.type = "button";
      indicator.setAttribute("aria-label", personaje);
      indicator.addEventListener("click", () => mostrarPersonajeIndex(index));
      personajeIndicators.appendChild(indicator);

      const item = document.createElement("div");
      item.className = "carousel-item character-card";
      item.dataset.personaje = personaje;
      item.innerHTML = `
        <img src="assets/img/pj/PERSONAJE/${personaje}.png" alt="${nombresPersonajes[personaje]}">
        <div class="character-card-info">
          <span class="character-card-name">${nombresPersonajes[personaje]}</span>
          <small>Color ${coloresPorPersonaje[personaje]}</small>
          <button type="button" class="btn character-card-pick">Elegir este personaje</button>
        </div>`;
      item.querySelector(".character-card-pick").addEventListener("click", () => marcarElegido(personaje));
      personajeInner.appendChild(item);
    });
    document.getElementById("personaje-prev").addEventListener("click", () => mostrarPersonajeIndex(personajeIndex - 1));
    document.getElementById("personaje-next").addEventListener("click", () => mostrarPersonajeIndex(personajeIndex + 1));
    mostrarPersonajeIndex(0);

    function pintarLobby(jugadores) {
      const conectados = jugadores.filter((j) => j.conectado);
      lobbyCount.textContent = `${conectados.length} conectado${conectados.length === 1 ? "" : "s"}`;
      lobbyList.innerHTML = "";
      if (!conectados.length) {
        const li = document.createElement("li");
        li.className = "lobby-empty";
        li.textContent = "Todavía no hay nadie en la cancha. ¡Sé el primero!";
        lobbyList.appendChild(li);
        return;
      }
      conectados.forEach((j) => {
        const info = paleta.find((c) => c.id === j.color);
        const li = document.createElement("li");
        li.innerHTML = `<span class="color-dot" style="background:${info ? info.hex : "#999"}"></span> ${j.nombre}`;
        lobbyList.appendChild(li);
      });
    }

    function aplicarEstado(estado) {
      paleta = estado.config.paleta;
      pintarLobby(estado.jugadores);
    }

    CIA.observar().then(aplicarEstado);
    CIA.socket.on("jugador_nuevo", () => CIA.observar().then(aplicarEstado));
    CIA.socket.on("jugador_reconectado", () => CIA.observar().then(aplicarEstado));
    CIA.socket.on("jugador_desconectado", () => CIA.observar().then(aplicarEstado));

    const sesionPrevia = CIA.obtenerSesion();
    if (sesionPrevia) {
      CIA.reclamarSesion().then((res) => {
        if (res.ok) window.location.href = "pages/cancha.html";
      });
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      errorEl.hidden = true;
      const nombre = nombreInput.value.trim();
      if (!personajeElegido) {
        errorEl.textContent = "Elige tu personaje y color.";
        errorEl.hidden = false;
        return;
      }
      if (!nombre) {
        errorEl.textContent = "Ingresa el nombre del jugador.";
        errorEl.hidden = false;
        return;
      }
      submitBtn.disabled = true;
      const respuesta = await CIA.unirse(nombre, colorElegido, personajeElegido);
      submitBtn.disabled = false;
      if (!respuesta.ok) {
        errorEl.textContent = respuesta.motivo || "No se pudo entrar a la cancha.";
        errorEl.hidden = false;
        return;
      }
      window.location.href = "pages/cancha.html";
    });
  </script>
</body>
</html>
