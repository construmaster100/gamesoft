<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cancha CR7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage" id="main-content">

      <div class="field-frame" id="field-frame">
        <img class="static-pitch-image" src="../assets/img/CANCHA%20FUTBOL/grilla%207x10.png" alt="Cancha de fútbol con grilla fija">
        <svg id="pitch-svg" viewBox="0 0 1672 941" preserveAspectRatio="none" role="img"
             aria-label="Cancha de fútbol con grilla interactiva de 7 filas por 13 columnas">
          <!-- La textura real, la grilla y las celdas se montan por JavaScript. -->
        </svg>

        <div class="field-caption">
          Imagen fija · grilla 7 × 13 · WASD / flechas para caminar
        </div>

        <div class="action-bar">
          <button type="button" class="action-btn action-x" id="btn-mark-x">Marcar X</button>
          <button type="button" class="action-btn action-o" id="btn-mark-o">Marcar O</button>
          <button type="button" class="action-btn action-color" id="btn-color">Pintar celda (ESPACIO)</button>
        </div>

        <section class="image-gallery" id="image-gallery" hidden aria-label="Imagen de la casilla seleccionada">
          <button type="button" class="gallery-close" id="gallery-close" aria-label="Cerrar galería">×</button>
          <div class="gallery-heading">
            <span id="gallery-cell">Casilla —</span>
            <span id="gallery-counter">1 / 1</span>
          </div>
          <img id="gallery-image" src="" alt="Imagen de la serie de la casilla seleccionada">
          <div class="gallery-controls">
            <button type="button" class="gallery-btn" id="gallery-prev" aria-label="Imagen anterior">←</button>
            <button type="button" class="gallery-btn" id="gallery-next" aria-label="Imagen siguiente">→</button>
          </div>
        </section>
      </div>

      <section class="bottom-dashboard" aria-label="Jugadores conectados">
        <div class="score-panel connected-panel">
          <div class="dashboard-heading">
            <span>Jugadores conectados</span>
            <span id="players-count">1</span>
          </div>
          <div class="table-scroll">
            <table class="score-table">
              <thead>
                <tr><th>Jugador</th><th>Estado</th><th>Casillas</th></tr>
              </thead>
              <tbody id="players-list"></tbody>
            </table>
          </div>
        </div>
      </section>

      <aside class="score-sidebar" aria-label="Tabla de puntajes">
        <div class="score-panel ranking-panel">
          <div class="dashboard-heading">
            <span>Tabla de puntajes</span>
            <span>TOP 5</span>
          </div>
          <div class="table-scroll">
            <table class="score-table">
              <thead>
                <tr><th>#</th><th>Jugador</th><th>Puntaje</th></tr>
              </thead>
              <tbody id="top5-list"></tbody>
            </table>
          </div>
        </div>
      </aside>

      <div class="runtime-status" aria-hidden="true">
        <span id="zone-number">—</span>
        <span id="zone-coords">Fila — · Columna —</span>
        <span id="zone-desc">—</span>
        <span id="visited-count">0 / 91</span>
        <span id="minimap-zone">ZONA — / 91</span>
        <span id="minimap-coords">Fila — · Columna —</span>
        <button type="button" id="minimap" hidden aria-label="Minimapa"></button>
        <span id="minimap-location"></span>
        <span id="minimap-players"></span>
      </div>

  <script src="script.js"></script>
</body>
</html>
